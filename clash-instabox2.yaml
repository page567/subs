proxies:
  - name: InstaBox2-US-xhttp
    type: vless
    server: ib2.page56.dpdns.org
    port: 443
    uuid: 65d454ad-586d-403f-a07c-f1b05c6dc804
    network: xhttp
    tls: true
    udp: true
    servername: ib2.page56.dpdns.org
    xhttp-opts:
      path: "/p56ws"
      host: "ib2.page56.dpdns.org"
      mode: "packet-up"

proxy-groups:
  - name: InstaBox2
    type: select
    proxies:
      - InstaBox2-US-xhttp
      - DIRECT

rules:
  - MATCH,InstaBox2
